name: Windows-EXE bauen

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release mit diesem Tag erstellen (z.B. v1.0.1) – leer lassen, um nur zu bauen"
        required: false
        default: ""

jobs:
  build-exe:
    runs-on: windows-latest
    permissions:
      contents: write  # nur für das Release bei Tags v*
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        run: pytest -q

      - name: EXE bauen
        run: pyinstaller --noconfirm packaging/ProductCon.spec

      - name: EXE testen
        shell: pwsh
        run: |
          .\dist\ProductCon.exe examples -o smoke --title "{name}" --no-pause
          if ($LASTEXITCODE -ne 0) { throw "ProductCon.exe ist fehlgeschlagen" }
          $n = (Get-ChildItem smoke -Filter *.jpg).Count
          if ($n -ne 3) { throw "Erwartet 3 Bilder, gefunden: $n" }

      - name: Paket zusammenstellen
        shell: pwsh
        run: |
          $dir = "release/ProductCon"
          New-Item -ItemType Directory -Force -Path "$dir/input", "$dir/beispiele" | Out-Null
          Copy-Item dist/ProductCon.exe $dir
          Copy-Item productcon.json $dir
          Copy-Item packaging/LIESMICH.txt $dir
          Copy-Item packaging/input-hinweis.txt "$dir/input/HIER BILDER REINLEGEN.txt"
          Copy-Item examples/* "$dir/beispiele"
          Copy-Item productcon/fonts/OFL.txt "$dir/Schriften-Lizenz.txt"
          Compress-Archive -Path $dir -DestinationPath ProductCon-Windows.zip -Force

      - name: Als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: ProductCon-Windows
          path: release/

      - name: Release erstellen (Tag v* oder manuell mit release_tag)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ProductCon ${{ inputs.release_tag || github.ref_name }}
          body: |
            **Download:** `ProductCon-Windows.zip` unten bei *Assets* herunterladen und entpacken.

            1. Bilder in den Ordner `input` legen und `ProductCon.exe` doppelklicken – oder Bilder direkt auf die EXE ziehen.
            2. Die fertigen Produktbilder landen im Ordner `output`.
            3. Aussehen (Theme, Titel, Shopname, Größe …) in `productcon.json` anpassen.

            Windows zeigt beim ersten Start evtl. „Der Computer wurde durch Windows geschützt“ → *Weitere Informationen* → *Trotzdem ausführen* (die EXE ist nicht signiert).
          files: ProductCon-Windows.zip
