plugins {
    // Minecraft 26.x ist nicht mehr obfuskiert: kein Mappings-Eintrag, kein Remapping.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Tests laufen mit echtem Minecraft-Bootstrap (Block-Registry) über den Fabric-Loader
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
    testImplementation platform("org.junit:junit-bom:5.13.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    testLogging {
        events "failed"
        exceptionFormat "full"
        showStandardStreams = false
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

processResources {
    def props = [
        version          : project.mod_version,
        minecraft_version: project.minecraft_version,
        loader_version   : project.loader_version
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

// Nur für die CI-Diagnose: gibt den Compile-Classpath aus.
tasks.register('printClasspath') {
    def cp = configurations.compileClasspath
    doLast {
        cp.files.each { println "CP ${it}" }
    }
}
